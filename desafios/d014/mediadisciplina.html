<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médias</title>

    <style>
        
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        
        
        table{
            
            width: 600px;
            border-collapse: collapse;
            
        }

       td, th{
        border: 1px solid black;
        text-align: center;
        padding: 10px;
       }

       thead{
        background-color: gray;
        color: white;
       }

       .media{
        background-color: gray;
        color: white;
        
       }
    
       .esquerda{
        text-align: left;
       }

       caption{
        border: 1px solid black;
        padding: 10px;
        font-size: 18px;
        font-weight: bold;
       }
    </style>
</head>
<body>

    <table>
        <caption>Médias de disciplinas escolares</caption>
        
        <thead>
            
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="4"><strong>Exatas</strong></td>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="media">
                <td class="esquerda" colspan="4"><strong>Média de Exatas</strong></td>
                <td>0.0</td>
            </tr>
            <tr>
                <td rowspan="2"><strong>Humanas</strong></td>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="media">
                <td class="esquerda" colspan="4"><strong>Média de Humanas</strong></td>
                <td>0.0</td>
            </tr>
        </tbody>
       
    </table>
</body>
</html>
